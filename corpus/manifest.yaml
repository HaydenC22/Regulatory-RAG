# Corpus manifest for the MAS regulatory corpus.
#
# `pdf_url` is fetched directly by services/ingestion/fetch.py. `page_url` is the
# human-readable MAS page the PDF was sourced from, kept as a fallback reference
# in case MAS reorganises their media-library paths (they do, periodically).
#
# No sha256 is hand-pinned here: fetch.py computes it on first successful download
# and records it in corpus/manifest.lock.yaml, then verifies against that lock on
# every subsequent run so a MAS-side document update is visible as a diff, not a
# silent corpus change.

